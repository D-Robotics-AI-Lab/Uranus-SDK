[project]
name = "uranus-sdk"
version = "0.1.0"
description = "Python SDK for the Uranus video generation serving API"
readme = "README.md"
authors = [
    { name = "Wenkang Qin", email = "wkqin@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
